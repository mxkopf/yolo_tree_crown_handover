[project]
name = "yolo-tree-crown-project"
version = "0.1.0"
description = "YOLO workflow for individual tree crown mapping from RGBI aerial imagery."
requires-python = ">=3.12"
dependencies = [
    "geopandas",
    "numpy",
    "pyyaml>=6.0.3",
    "rasterio",
    "tifffile",
    "ultralytics>=8.4.155",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
